<body class="login-page">

<aside>

</aside>
<main>
  <h1>Iniciar Sesión</h1>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="suggestions" id="login-form" action="" method="post">
    <label for="username">Nombre:</label>
    <input type="text" id="username" name="username" placeholder="Nombre de usuario"
           formControlName="username">
    @if (username?.touched && username?.hasError('required')) {
      <small>Campo obligatorio</small>
    }
    <label for="password">Contraseña:</label>
    <div class="input-wrapper">
      <input [type]="showPassword ? 'text' : 'password'"
             id="password" name="password" placeholder="Contraseña"
             formControlName="password">
      <button type="button" (click)="togglePassword()">
        <img [src]="showPassword ? 'assets/eye-off.svg' : 'assets/eye.svg'" alt="alternar contraseña">
      </button>
    </div>
    @if (password?.touched && password?.hasError('required')) {
      <small>Campo obligatorio</small>
    }
    <button type="submit" [disabled]="form.invalid">Iniciar Sesión</button>
  </form>
  <app-popup-form #popup/>
  <div class="form-footer">
    <a href="#" (click)="popup.open(); $event.preventDefault()">He olvidado mi contraseña</a>
    <a routerLink="/register">¿No tienes cuenta? Regístrate</a>
  </div>
</main>

</body>
