<div class="card shadow-sm border-0">
  <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
    <h5 class="mb-0"><i class="bi bi-bus-front me-2"></i>Nueva Línea de Transporte</h5>
    <button type="button" class="btn-close btn-close-white" aria-label="Close"></button>
  </div>

  <form [formGroup]="lineaForm" (ngSubmit)="guardar()" class="card-body p-4">

    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <label class="form-label fw-semibold text-secondary">Número de Línea</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="bi bi-hash"></i></span>
          <input type="number" formControlName="numero" class="form-control" placeholder="Ej: 01">
        </div>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold text-secondary">Origen (Cabecera)</label>
        <input type="text" formControlName="primera_salida" class="form-control" placeholder="Nombre de parada inicial">
      </div>
      <div class="col-md-5">
        <label class="form-label fw-semibold text-secondary">Destino (Terminal)</label>
        <input type="text" formControlName="segunda_salida" class="form-control" placeholder="Nombre de parada final">
      </div>
    </div>

    <div class="mb-4">
      <div class="d-flex align-items-center mb-3">
        <h6 class="mb-0 text-primary fw-bold"><i class="bi bi-clock-history me-2"></i>Configuración de Horarios</h6>
        <hr class="flex-grow-1 ms-3 opacity-25">
        <button type="button" (click)="agregarHorario()" class="btn btn-sm btn-outline-primary ms-2">
          <i class="bi bi-plus-circle"></i> Añadir Bloque
        </button>
      </div>

      <div formArrayName="horariosArray">
        @for (h of horarios.controls; track $index) {
          <div [formGroupName]="$index" class="row g-2 mb-2 align-items-end p-2 border rounded bg-light-subtle">
            <div class="col-md-3">
              <select formControlName="sentido" class="form-select form-select-sm">
                <option value="ida">Ida</option>
                <option value="vuelta">Vuelta</option>
              </select>
            </div>
            <div class="col-md-4">
              <select formControlName="tipo_dia" class="form-select form-select-sm">
                @for (td of tiposDias; track td) { <option [value]="td">{{td}}</option> }
              </select>
            </div>
            <div class="col-md-4">
              <input formControlName="salidas" class="form-control form-control-sm" placeholder="HH:mm, HH:mm...">
            </div>
            <div class="col-md-1 text-center">
              <button type="button" (click)="eliminarHorario($index)" class="btn btn-link text-danger p-0">
                <i class="bi bi-trash3"></i>
              </button>
            </div>
          </div>
        }
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2 pt-3 border-top mt-4">
      <button type="button" class="btn btn-light border px-4" (click)="lineaForm.reset()">Cancelar</button>
      <button type="submit" class="btn btn-primary px-4 shadow-sm" [disabled]="lineaForm.invalid">
        <i class="bi bi-cloud-arrow-up me-2"></i>Guardar Línea
      </button>
    </div>

  </form>
</div>
