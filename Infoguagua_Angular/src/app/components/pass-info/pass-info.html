<article class="info-pass">
  <div class="container-pass">
    <img class="img-pass" src="assets/Tarjeta_Wawa_Joven.png" alt="Imágen del bono de guagua">
    <div class="text">
      <p>{{ pass.tipoBono }}</p>
      <p>Viajes realizados: {{ pass.viajesRealizados }}</p>
      <p>Fecha de caducidad: {{ pass.caducidad }}</p>
      <p>Saldo: {{ pass.saldo }}</p>
    </div>
  </div>
  <button class="button-pass" (click)="onEliminar()">
    <img src="assets/x.svg" alt="X">
  </button>
</article>
