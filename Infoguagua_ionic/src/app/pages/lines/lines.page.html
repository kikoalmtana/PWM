<ion-header>
  <app-header></app-header>
</ion-header>

<ion-content>

  <app-heading texto="Lineas"></app-heading>

  <ion-searchbar
    [(ngModel)]="searchTerm"
    placeholder="Número o nombre de la línea"
    name="search"
    class="ion-margin-bottom">
  </ion-searchbar>

  @if (lineas().length === 0) {
    <ion-spinner name="crescent"></ion-spinner>
    <ion-text class="ion-text-center">
      <p>Cargando líneas...</p>
    </ion-text>
  }

  @for (linea of lineasFiltradas; track linea.id) {
    <div class="line-selector" [routerLink]="['/line-info']" [queryParams]="{ id: linea.id }">
      <div class="line-number">{{ linea.numero }}</div>
      <div class="line-name">{{ linea.primera_salida }} - {{ linea.segunda_salida }}</div>
      <div class="line-icon"></div>
    </div>
  }

  @if (lineas().length > 0 && lineasFiltradas.length === 0) {
    <ion-text class="ion-text-center">
      <p>No se encontraron líneas con ese criterio.</p>
    </ion-text>
  }

</ion-content>
