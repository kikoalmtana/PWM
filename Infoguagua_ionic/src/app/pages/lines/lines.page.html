<ion-header>
  <app-header></app-header>
</ion-header>

<ion-content [fullscreen]="true" class="lines-page">
  <app-heading texto="LINEAS"></app-heading>

  <section class="search-area">
    <ion-searchbar
      [(ngModel)]="searchTerm"
      placeholder="Numero o nombre de la linea"
      name="search"
      animated="true"
      show-clear-button="focus">
    </ion-searchbar>
  </section>

  <section class="warnings-container">
    <app-lines-warnings />
  </section>

  <section class="lines-list" id="listado-lineas">
    @if (lineas().length === 0) {
      <div class="feedback">
        <ion-spinner name="crescent"></ion-spinner>
        <ion-text>
          <p>Cargando lineas...</p>
        </ion-text>
      </div>
    }

    @for (linea of lineasFiltradas; track linea.id) {
      <ion-item
        class="line-selector"
        button
        detail="false"
        lines="none"
        [routerLink]="['/line-info']"
        [queryParams]="{ id: linea.id }">
        <div class="line-number" slot="start">{{ linea.numero }}</div>
        <ion-label class="line-name">
          {{ linea.primera_salida }} - {{ linea.segunda_salida }}
        </ion-label>
        <ion-button
          class="line-icon favorite-button"
          [class.favorite-active]="isFavorite(linea)"
          [disabled]="isFavoriteLoading(linea)"
          fill="clear"
          slot="end"
          type="button"
          [attr.aria-label]="isFavorite(linea) ? 'Quitar de favoritos' : 'Anadir a favoritos'"
          (click)="toggleFavorite($event, linea)">
          <ion-icon [name]="isFavorite(linea) ? 'heart' : 'heart-outline'"></ion-icon>
        </ion-button>
      </ion-item>
    }

    @if (lineas().length > 0 && lineasFiltradas.length === 0) {
      <ion-text class="feedback">
        <p>No se encontraron lineas con ese criterio.</p>
      </ion-text>
    }
  </section>
</ion-content>
