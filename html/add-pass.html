<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../img/logo/isotipo.svg">
    <title>Añadir bono</title>
    <script src="../js/templateLoader.js"></script>
    <script src="../js/formValidation.js" defer></script>
    <link rel="stylesheet" href="../styles.css">
</head>

<body class="bonus-page">
<header data-template="header"></header>

<main>

    <h1 class="login-header">Añade un Bono a tu cuenta</h1>


    <img src = "../img/Tarjeta_Wawa_Joven.png" class="image-box" alt = "">

    <form novalidate class = "suggestions">

        <div class="selector">
            <div class="selected" onclick="toggleOptions()">
                Selecciona un bono
            </div>
            <div class="options" id="options">
                <div class="option" onclick="selectOption(this, 'basico')">Bono Guagua</div>
                <div class="option" onclick="selectOption(this, 'con_dni')">Bono Residente Canario</div>
                <div class="option" onclick="selectOption(this, 'con_dni')">Tarjeta Wawa Joven</div>
                <div class="option" onclick="selectOption(this, 'con_dni')">Tarjeta bono oro</div>
            </div>
        </div>

        <input id="passCode" type="number" placeholder="Código de bono" required
               maxlength="6" minlength="6"
               data-error-short="Debe de tener 6 caracteres">
        <small data-error-for="passCode"></small>

        <input id="dniField" type="text" placeholder="DNI"
               pattern="^[0-9]{8}[A-Za-z]$" minlength="9" maxlength="9"
               data-error-short="Debe de tener 9 caracteres"
               data-error-pattern="El DNI debe tener 8 números y una letra"
               data-validate-dni>
        <small data-error-for="dniField"></small>

        <button type="submit">Enviar</button>
    </form>

</main>

<footer data-template="footer"></footer>

</body>

<script src="../js/interactions.js"></script>

</html>
