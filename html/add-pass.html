<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../img/logo/isotipo.svg">
    <title>Añadir bono</title>
    <script src="../js/templateLoader.js"></script>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
<header data-template="header"></header>

<main class="bonus-page">

    <h1 class="login-header">Añade un Bono a tu cuenta</h1>


    <img src = "../img/Tarjeta_Wawa_Joven.png" class="image-box" alt = "">

    <form class = "suggestions">

        <div class="selector">
            <div class="selected" onclick="toggleOptions()">
                Selecciona un bono
            </div>
            <div class="options" id="options">
                <div class="option" onclick="selectOption(this, 'basico')">Bono Guagua</div>
                <div class="option" onclick="selectOption(this, 'con_dni')">Bono Residente Canario</div>
                <div class="option" onclick="selectOption(this, 'con_dni')">Tarjeta Wawa Joven</div>
                <div class="option" onclick="selectOption(this, 'con_dni')">Tarjeta bono oro</div>
            </div>
        </div>

        <!-- Siempre es visible -->
        <input type="text" placeholder="Código de bono" required>

        <!-- Aparece que si la opción es con_dni -->
        <div id="dniField" style="display:none;">
            <input type="text" placeholder="DNI" required>
        </div>

        <button type="submit">Enviar</button>
    </form>

</main>

<footer data-template="footer"></footer>

</body>

<script src="../js/interactions.js"></script>

</html>
