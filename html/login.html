<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../img/logo/isotipo.svg">
    <title>Log in</title>
    <script src="../js/templateLoader.js"></script>
    <script src="../js/popUp.js"></script>
    <script src="../js/interactions.js" defer></script>
    <script src="../js/formValidation.js" defer></script>
    <script type="module" src="../js/login.js"></script>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="login-page">

  <aside data-template="aside"></aside>
  <main>
    <h1>Iniciar Sesión</h1>
    <form novalidate class="suggestions" id="login-form" action="" method="post">
      <label for="username">Nombre:</label>
      <input type="text" id="username" name="username" placeholder="Nombre de usuario" required
             pattern="^(?=.*[A-Za-z]).+$" minlength="3" maxlength="50"
             data-error-short="El nombre debe tener más de 3 caracteres"
             data-error-pattern="El nombre debe contener alguna letra">
      <small data-error-for="username"></small>
      <label for="password">Contraseña:</label>
      <div class="input-wrapper">
        <input type="password" id="password" name="password" placeholder="Contraseña" required
               pattern="^(?=.*[A-Za-z])(?=.*\d).+$" minlength="4" maxlength="50"
               data-error-short="La contraseña debe tener más de 4 caracteres"
               data-error-pattern="La contraseña debe contener minimo una letra y un numero">
        <button type="button" id="toggle-btn"><img src="../img/eye-off.svg" alt=""></button>
      </div>
      <small data-error-for="password"></small>
      <button type="submit">Iniciar Sesión</button>
    </form>
    <div class="overlay" id="overlay">
        <div class="popup">
            <div class="popup-header">
                <h3>Recuperar contraseña</h3>
                <button id="closePopup"><img src="../img/x.svg" alt="cross"></button>
            </div>
            <p>Introduce tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>
            <form class="suggestions" id="formContent" action="">
                <label for="inputEmail">Email:</label>
                <input type="email" id="inputEmail" name="recovery" placeholder="usuario@gmail.com" required>
                <button type="submit" id="sendBtn">Enviar</button>
            </form>
            <p id="successMsg">✓ Correo enviado correctamente, revisa tu bandeja de entrada.</p>
        </div>
    </div>
    <div class="form-footer">
      <a href="#" id="openPopup">He olvidado mi contraseña</a>
      <a href="./register.html">¿No tienes cuenta? Regístrate</a>
    </div>
  </main>

</body>
</html>
