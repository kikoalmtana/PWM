<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../img/logo/isotipo.svg">
  <title>Información de Bono</title>
  <script src="../js/templateLoader.js"></script>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>

<header data-template="header"></header>

<main class = "info-bonos">

  <h1>Header</h1>

  <div class="user-pass">
    <article data-template="pass-info" ></article>
  </div>

</main>

<script>
  async function init() {
    const elements = document.querySelectorAll('[data-template]');
    const promises = Array.from(elements).map(async (el) => {
      const name = el.getAttribute("data-template");
      const response = await fetch(`/templates/${name}.html`);
      el.innerHTML = await response.text();
    });
    await Promise.all(promises);

    // Ahora ya están cargados los templates, inyectamos el bono
    const bono = JSON.parse(sessionStorage.getItem("bonoActivo"));

    if (!bono) {
      document.querySelector(".user-pass").innerHTML =
              "<p>No hay ningún bono cargado. <a href='add-pass.html'>Añadir bono</a></p>";
      return;
    }

    // ─── IMÁGENES POR TIPO DE BONO ───────────────────────────────────────────────
    const imagenes = {
      "Bono Guagua":            "../img/Bono_guagua.jpg",
      "Bono Residente Canario": "../img/Tarjeta_BonoResidente.jpg",
      "Tarjeta Guagua Joven":   "../img/Tarjeta_Wawa_Joven.png",
      "Tarjeta Bono Oro":       "../img/Tarjeta_bono_oro.png",
    };

    const imgSrc = imagenes[bono.tipo_de_bono] || "../img/Tarjeta_Wawa_Joven.png";

    const fecha = new Date(bono.fecha_caducidad).toLocaleDateString("es-ES", {
      day: "2-digit", month: "long", year: "numeric"
    });

    const saldoTexto = bono.saldo !== null ? `${bono.saldo.toFixed(2)} €` : "—";

    const article = document.querySelector("article.info-pass")
            ?? document.querySelector("[data-template='pass-info']");

    if (article) {
      article.innerHTML = `
        <div class="container-pass">
          <img class="img-pass" src="${imgSrc}" alt="Imagen del bono">
          <div class="text">
            <p><strong>${bono.tipo_de_bono}</strong></p>
            ${bono.propietario_bono ? `<p>Titular: ${bono.propietario_bono}</p>` : ""}
            <p>Viajes realizados: ${bono.viajes_realizados}</p>
            <p>Caduca: ${fecha}</p>
            ${bono.saldo !== null ? `<p>Saldo: ${saldoTexto}</p>` : ""}
          </div>
        </div>
        <button class="button-pass" onclick="eliminarBono()">
          <img src="../img/x.svg" alt="Eliminar bono">
        </button>
      `;
    }

    const h1 = document.querySelector("main h1");
    if (h1) h1.textContent = bono.tipo_de_bono;
  }

  document.addEventListener("DOMContentLoaded", init);

  function eliminarBono() {
    sessionStorage.removeItem("bonoActivo");
    window.location.href = "select-pass.html";
  }
</script>

</body>

<footer data-template="footer"></footer>

</html>
