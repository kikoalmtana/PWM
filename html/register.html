<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="../xlu-include-file.js"></script>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="login-page">

  <aside xlu-include-file="../templates/aside.html"></aside>
  <main>
    <h1 class="login-header">Registrarse</h1>
    <form class="suggestions" action="" method="post">
        <label for="username">Nombre:</label>
        <input type="text" id="username" name="username" placeholder="Nombre" required>
        <label for="email">Email:</label>
        <input type="text" id="email" name="email" placeholder="usuario@gmail.com" required>
        <label for="password">Contraseña:</label>
        <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="Contraseña" required>
            <button type="button" id="toggle-btn" onclick=""><img src="../img/eye.svg" alt=""></button>
        </div>
        <label for="confim-password">Confirmar Contraseña:</label>
        <div class="input-wrapper">
            <input type="password" id="confim-password" name="password" placeholder="Contraseña" required>
            <button type="button" id="toggle-btn2" onclick=""><img src="../img/eye.svg" alt=""></button>
        </div>
        <button type="submit">Registrarse</button>
    </form>
  </main>

  <script>

    xLuIncludeFile();

  </script>
</body>
</html>
