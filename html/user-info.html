<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../img/logo/isotipo.svg">
  <title>User information</title>
  <script src="../js/popUp.js" ></script>
  <script src="../js/templateLoader.js"></script>
  <script type="module" src="../js/user-info.js" ></script>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>

<header data-template="header"></header>

<main class="user-profile">
  <h1>Tu perfil</h1>
  <div class="user-info">
    <div>
      <h3>Username</h3>
      <a href="../html/user-edit.html">
        <img src="../img/edit.svg" alt="Edit account access">
      </a>
    </div>
  </div>
  <div class="user-pass">
    <article data-template="pass-info" ></article>
    <article class="add-pass">
      <a class="añadir" href="../html/add-pass.html">AÑADIR</a>
      <a class="plus" href="../html/add-pass.html"><img src="../img/plus.svg" alt="add new pass"></a>
    </article>
  </div>
  <div class="overlay" id="overlay">
    <div class="popup">
      <h3>¿Estás seguro?</h3>
      <p>Con esta acción borrarás todos tus datos de forma permanentemente.</p>
      <div class="buttons">
        <button id="closePopup">Cancelar</button>
        <button>Borrar cuenta</button>
      </div>
    </div>
  </div>
  <div class="user-footer">
    <button id="logout">Cerrar sesión</button>
    <button id="openPopup">Borrar cuenta</button>
  </div>

</main>

<footer data-template="footer"> </footer>

<script>
  document.getElementById('logout').addEventListener('click', () => {
    sessionStorage.removeItem('userId');
    window.location.href = '../html/login.html';
  });
</script>

</body>
</html>
